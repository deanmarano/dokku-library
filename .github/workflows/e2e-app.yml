name: E2E App Test

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      manifest:
        required: true
        type: string
      test-spec:
        required: true
        type: string
      dokku-plugins:
        required: false
        type: string
        default: ""
      extra-deploy-flags:
        required: false
        type: string
        default: ""
      artifact-name:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/deanmarano/dokku-library-ci:latest
      options: --privileged
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker daemon
        run: |
          dockerd &
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            echo "Waiting for Docker daemon... ($i/30)"
            sleep 1
          done
          docker info
      - name: Initialize Dokku plugins
        run: dokku plugin:install-dependencies --core
      - name: Set up node_modules
        run: cp -r /npm-cache/node_modules ./node_modules
      - name: Install library plugin
        run: |
          mkdir -p /var/lib/dokku/plugins/available/library/subcommands
          mkdir -p /var/lib/dokku/plugins/available/library/library
          cp commands config functions install plugin.toml /var/lib/dokku/plugins/available/library/
          cp subcommands/* /var/lib/dokku/plugins/available/library/subcommands/
          cp -r library/* /var/lib/dokku/plugins/available/library/library/
          chmod +x /var/lib/dokku/plugins/available/library/commands
          chmod +x /var/lib/dokku/plugins/available/library/subcommands/*
          dokku plugin:enable library || true
          bash /var/lib/dokku/plugins/enabled/library/install
          dokku library:list
      - name: Deploy app via bash
        run: |
          echo "127.0.0.1 ${{ inputs.app-name }}.test.local" | tee -a /etc/hosts
          dokku library:checkout ${{ inputs.manifest }} \
            --name=${{ inputs.app-name }} \
            --domain=${{ inputs.app-name }}.test.local \
            --no-ssl --no-auth --non-interactive ${{ inputs.extra-deploy-flags }}
      - name: Verify deployment state
        run: |
          echo "=== App exists? ==="
          dokku apps:exists ${{ inputs.app-name }} && echo "YES" || echo "NO"
          echo "=== ps:report ==="
          dokku ps:report ${{ inputs.app-name }} 2>&1 || true
          echo "=== config:show ==="
          dokku config:show ${{ inputs.app-name }} 2>&1 || true
          echo "=== Docker containers ==="
          docker ps -a 2>&1 || true
          echo "=== Library state ==="
          ls -laR /var/lib/dokku/services/library/apps/${{ inputs.app-name }}/ 2>&1 || echo "STATE DIR MISSING"
      - name: Run e2e tests
        run: npx playwright test ${{ inputs.test-spec }} --project=integration
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}-results
          path: playwright-report/
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Plugin paths ==="
          ls -la /var/lib/dokku/plugins/available/library/ || true
          ls -la /var/lib/dokku/plugins/enabled/library/ || true
          echo "=== library:list ==="
          dokku library:list 2>&1 || true
          echo "=== Dokku apps ==="
          dokku apps:list 2>/dev/null || true
          echo "=== ps:report ==="
          dokku ps:report 2>/dev/null || true
          echo "=== Docker containers ==="
          docker ps -a 2>/dev/null || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq 2>/dev/null); do
            echo "--- Container $container ---"
            docker logs --tail 50 "$container" 2>/dev/null || true
          done
          echo "=== Library state ==="
          ls -laR /var/lib/dokku/services/library/apps/ 2>&1 || echo "No state dir"
