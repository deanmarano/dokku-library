name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
    types: [opened, synchronize, reopened, labeled]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      test-infra: ${{ steps.filter.outputs.test-infra }}
      force-all: ${{ steps.force.outputs.force }}
      app-matrix: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for force-e2e label
        id: force
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'force-e2e') }}" == "true" ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'commands'
              - 'config'
              - 'functions'
              - 'install'
              - 'subcommands/**'
            test-infra:
              - 'tests/e2e/helpers.ts'
              - 'tests/e2e/global-setup.ts'
              - 'tests/e2e/global-teardown.ts'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
            ghost:
              - 'library/ghost/**'
              - 'tests/e2e/apps/ghost.spec.ts'
            gitea:
              - 'library/gitea/**'
              - 'tests/e2e/apps/gitea.spec.ts'
            grafana:
              - 'library/grafana/**'
              - 'tests/e2e/apps/grafana.spec.ts'
            uptime-kuma:
              - 'library/uptime-kuma/**'
              - 'tests/e2e/apps/uptime-kuma.spec.ts'
            plausible:
              - 'library/plausible/**'
              - 'tests/e2e/apps/plausible.spec.ts'
            miniflux:
              - 'library/miniflux/**'
              - 'tests/e2e/apps/miniflux.spec.ts'
            wallabag:
              - 'library/wallabag/**'
              - 'tests/e2e/apps/wallabag.spec.ts'
            linkding:
              - 'library/linkding/**'
              - 'tests/e2e/apps/linkding.spec.ts'
            nextcloud:
              - 'library/nextcloud/**'
              - 'tests/e2e/apps/nextcloud.spec.ts'
            jellyfin:
              - 'library/jellyfin/**'
              - 'tests/e2e/apps/jellyfin.spec.ts'
            immich:
              - 'library/immich/**'
              - 'tests/e2e/apps/immich.spec.ts'
            radarr:
              - 'library/radarr/**'
              - 'tests/e2e/apps/radarr.spec.ts'
            sonarr:
              - 'library/sonarr/**'
              - 'tests/e2e/apps/sonarr.spec.ts'
            vaultwarden:
              - 'library/vaultwarden/**'
              - 'tests/e2e/apps/vaultwarden.spec.ts'
            outline:
              - 'library/outline/**'
              - 'tests/e2e/apps/outline.spec.ts'
            bookstack:
              - 'library/bookstack/**'
              - 'tests/e2e/apps/bookstack.spec.ts'
            mealie:
              - 'library/mealie/**'
              - 'tests/e2e/apps/mealie.spec.ts'
            paperless-ngx:
              - 'library/paperless-ngx/**'
              - 'tests/e2e/apps/paperless-ngx.spec.ts'

      - name: Build app matrix
        id: matrix
        run: |
          ALL_APPS='["ghost","gitea","grafana","uptime-kuma","plausible","miniflux","wallabag","linkding","nextcloud","jellyfin","immich","radarr","sonarr","vaultwarden","outline","bookstack","mealie","paperless-ngx"]'

          FORCE="${{ steps.force.outputs.force }}"
          CORE="${{ steps.filter.outputs.core }}"
          TEST_INFRA="${{ steps.filter.outputs.test-infra }}"

          # If force label, push to main, core changes, or test infra changes → run all
          if [[ "$FORCE" == "true" || "$CORE" == "true" || "$TEST_INFRA" == "true" ]]; then
            echo "apps=$ALL_APPS" >> "$GITHUB_OUTPUT"
            echo "Running all app tests (force=$FORCE, core=$CORE, test-infra=$TEST_INFRA)"
            exit 0
          fi

          # Otherwise, only include apps whose files changed
          APPS="["
          SEP=""
          if [[ "${{ steps.filter.outputs.ghost }}" == "true" ]]; then APPS="${APPS}${SEP}\"ghost\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.gitea }}" == "true" ]]; then APPS="${APPS}${SEP}\"gitea\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.grafana }}" == "true" ]]; then APPS="${APPS}${SEP}\"grafana\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.uptime-kuma }}" == "true" ]]; then APPS="${APPS}${SEP}\"uptime-kuma\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.plausible }}" == "true" ]]; then APPS="${APPS}${SEP}\"plausible\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.miniflux }}" == "true" ]]; then APPS="${APPS}${SEP}\"miniflux\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.wallabag }}" == "true" ]]; then APPS="${APPS}${SEP}\"wallabag\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.linkding }}" == "true" ]]; then APPS="${APPS}${SEP}\"linkding\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.nextcloud }}" == "true" ]]; then APPS="${APPS}${SEP}\"nextcloud\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.jellyfin }}" == "true" ]]; then APPS="${APPS}${SEP}\"jellyfin\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.immich }}" == "true" ]]; then APPS="${APPS}${SEP}\"immich\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.radarr }}" == "true" ]]; then APPS="${APPS}${SEP}\"radarr\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.sonarr }}" == "true" ]]; then APPS="${APPS}${SEP}\"sonarr\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.vaultwarden }}" == "true" ]]; then APPS="${APPS}${SEP}\"vaultwarden\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.outline }}" == "true" ]]; then APPS="${APPS}${SEP}\"outline\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.bookstack }}" == "true" ]]; then APPS="${APPS}${SEP}\"bookstack\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.mealie }}" == "true" ]]; then APPS="${APPS}${SEP}\"mealie\""; SEP=","; fi
          if [[ "${{ steps.filter.outputs.paperless-ngx }}" == "true" ]]; then APPS="${APPS}${SEP}\"paperless-ngx\""; SEP=","; fi
          APPS="${APPS}]"

          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Changed apps: $APPS"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: shellcheck -x commands config install functions subcommands/*

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  e2e-checkout:
    needs: [lint, unit-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps

      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core

      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres

      - name: Install library plugin
        run: |
          sudo ln -s ${{ github.workspace }} /var/lib/dokku/plugins/available/library
          sudo dokku plugin:enable library

      - name: Run checkout e2e tests
        run: npx playwright test checkout

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-checkout-results
          path: playwright-report/

      - name: Collect logs on failure
        if: failure()
        run: |
          sudo dokku apps:list 2>/dev/null || true
          sudo dokku ps:report 2>/dev/null || true
          sudo docker ps -a 2>/dev/null || true

  e2e-ghost:
    needs: [lint, unit-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps

      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core

      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres

      - name: Install library plugin
        run: |
          sudo ln -s ${{ github.workspace }} /var/lib/dokku/plugins/available/library
          sudo dokku plugin:enable library

      - name: Run ghost e2e tests
        run: npx playwright test ghost

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ghost-results
          path: playwright-report/

      - name: Collect logs on failure
        if: failure()
        run: |
          sudo dokku apps:list 2>/dev/null || true
          sudo dokku ps:report 2>/dev/null || true
          sudo docker ps -a 2>/dev/null || true

  e2e-doctor:
    needs: [lint, unit-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps

      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core

      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres

      - name: Install library plugin
        run: |
          sudo ln -s ${{ github.workspace }} /var/lib/dokku/plugins/available/library
          sudo dokku plugin:enable library

      - name: Run doctor e2e tests
        run: npx playwright test doctor

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-doctor-results
          path: playwright-report/

      - name: Collect logs on failure
        if: failure()
        run: |
          sudo dokku apps:list 2>/dev/null || true
          sudo dokku ps:report 2>/dev/null || true
          sudo docker ps -a 2>/dev/null || true

  e2e-app:
    needs: [lint, unit-tests, changes]
    if: ${{ needs.changes.outputs.app-matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.app-matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps

      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core

      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres

      - name: Install dokku-auth
        run: sudo dokku plugin:install https://github.com/deanmarano/dokku-auth.git auth

      - name: Install library plugin
        run: |
          sudo ln -s ${{ github.workspace }} /var/lib/dokku/plugins/available/library
          sudo dokku plugin:enable library

      - name: Run ${{ matrix.app }} e2e tests
        run: npx playwright test tests/e2e/apps/${{ matrix.app }}.spec.ts

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-app-${{ matrix.app }}-results
          path: |
            playwright-report/
            test-results/

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Dokku apps ==="
          sudo dokku apps:list 2>/dev/null || true
          echo "=== Process report ==="
          sudo dokku ps:report 2>/dev/null || true
          echo "=== Docker containers ==="
          sudo docker ps -a 2>/dev/null || true
          echo "=== Auth services ==="
          sudo dokku auth:list 2>/dev/null || true
          sudo dokku auth:frontend:list 2>/dev/null || true
          echo "=== Docker logs ==="
          for container in $(sudo docker ps -aq 2>/dev/null); do
            echo "--- Container $container ---"
            sudo docker logs --tail 50 "$container" 2>/dev/null || true
          done
