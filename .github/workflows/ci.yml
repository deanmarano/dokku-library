name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
    types: [opened, synchronize, reopened, labeled]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: shellcheck -x commands config install functions subcommands/*

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # --- E2E jobs: enabling one-by-one ---
  # Known issues remaining:
  #   - dokku-auth repo doesn't exist yet (all e2e-app jobs)

  e2e-checkout:
    needs: [lint, unit-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps
      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core
      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres
      - name: Install library plugin
        run: |
          # Create plugin directory and copy essential files
          sudo mkdir -p /var/lib/dokku/plugins/available/library/subcommands
          sudo mkdir -p /var/lib/dokku/plugins/available/library/library
          sudo cp commands config functions install plugin.toml /var/lib/dokku/plugins/available/library/
          sudo cp subcommands/* /var/lib/dokku/plugins/available/library/subcommands/
          sudo cp -r library/* /var/lib/dokku/plugins/available/library/library/
          # Make scripts executable
          sudo chmod +x /var/lib/dokku/plugins/available/library/commands
          sudo chmod +x /var/lib/dokku/plugins/available/library/subcommands/*
          # plugin:enable exits 10 during bash-completion priming (DOKKU_NOT_IMPLEMENTED_EXIT) — expected
          sudo dokku plugin:enable library || true
          # Run the plugin install hook to create data directories
          sudo bash /var/lib/dokku/plugins/enabled/library/install
          # Verify the plugin is registered
          sudo dokku library:list
      - name: Run checkout e2e tests
        run: npx playwright test tests/e2e/checkout.spec.ts --project=integration
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-checkout-results
          path: playwright-report/
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Plugin paths ==="
          ls -la /var/lib/dokku/plugins/available/library/ || true
          ls -la /var/lib/dokku/plugins/enabled/library/ || true
          echo "=== Try running library:list ==="
          sudo dokku library:list 2>&1 || true
          echo "=== Dokku apps ==="
          sudo dokku apps:list 2>/dev/null || true
          sudo dokku ps:report 2>/dev/null || true
          sudo docker ps -a 2>/dev/null || true

