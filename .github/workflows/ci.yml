name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
    types: [opened, synchronize, reopened, labeled]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      lint: ${{ steps.filter.outputs.lint }}
      unit-tests: ${{ steps.filter.outputs.unit-tests }}
      e2e-checkout: ${{ steps.filter.outputs.e2e-checkout }}
      e2e-lifecycle: ${{ steps.filter.outputs.e2e-lifecycle }}
      e2e-doctor: ${{ steps.filter.outputs.e2e-doctor }}
      e2e-ghost: ${{ steps.filter.outputs.e2e-ghost }}
      e2e-linkding: ${{ steps.filter.outputs.e2e-linkding }}
      e2e-miniflux: ${{ steps.filter.outputs.e2e-miniflux }}
      e2e-vaultwarden: ${{ steps.filter.outputs.e2e-vaultwarden }}
      e2e-grafana: ${{ steps.filter.outputs.e2e-grafana }}
      e2e-radarr: ${{ steps.filter.outputs.e2e-radarr }}
      e2e-sonarr: ${{ steps.filter.outputs.e2e-sonarr }}
      e2e-jellyfin: ${{ steps.filter.outputs.e2e-jellyfin }}
      e2e-uptime-kuma: ${{ steps.filter.outputs.e2e-uptime-kuma }}
      e2e-mealie: ${{ steps.filter.outputs.e2e-mealie }}
      e2e-paperless-ngx: ${{ steps.filter.outputs.e2e-paperless-ngx }}
      e2e-outline: ${{ steps.filter.outputs.e2e-outline }}
      e2e-gitea: ${{ steps.filter.outputs.e2e-gitea }}
      e2e-bookstack: ${{ steps.filter.outputs.e2e-bookstack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'commands'
              - 'config'
              - 'functions'
              - 'install'
              - 'plugin.toml'
              - 'subcommands/**'
              - 'tests/e2e/helpers.ts'
              - 'tests/e2e/global-setup.ts'
              - 'tests/e2e/global-teardown.ts'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e-app.yml'
            lint:
              - 'commands'
              - 'config'
              - 'functions'
              - 'install'
              - 'subcommands/**'
              - '.github/workflows/ci.yml'
            unit-tests:
              - 'library/**'
              - 'tests/unit/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            e2e-checkout:
              - 'tests/e2e/checkout.spec.ts'
              - 'library/uptime-kuma/**'
            e2e-lifecycle:
              - 'tests/e2e/lifecycle.spec.ts'
              - 'library/uptime-kuma/**'
            e2e-doctor:
              - 'tests/e2e/doctor.spec.ts'
              - 'subcommands/doctor*'
              - 'library/uptime-kuma/**'
            e2e-ghost:
              - 'tests/e2e/ghost.spec.ts'
              - 'library/ghost/**'
            e2e-linkding:
              - 'tests/e2e/linkding.spec.ts'
              - 'library/linkding/**'
            e2e-miniflux:
              - 'tests/e2e/miniflux.spec.ts'
              - 'library/miniflux/**'
            e2e-vaultwarden:
              - 'tests/e2e/vaultwarden.spec.ts'
              - 'library/vaultwarden/**'
            e2e-grafana:
              - 'tests/e2e/grafana.spec.ts'
              - 'library/grafana/**'
            e2e-radarr:
              - 'tests/e2e/radarr.spec.ts'
              - 'library/radarr/**'
            e2e-sonarr:
              - 'tests/e2e/sonarr.spec.ts'
              - 'library/sonarr/**'
            e2e-jellyfin:
              - 'tests/e2e/jellyfin.spec.ts'
              - 'library/jellyfin/**'
            e2e-uptime-kuma:
              - 'tests/e2e/uptime-kuma.spec.ts'
              - 'library/uptime-kuma/**'
            e2e-mealie:
              - 'tests/e2e/mealie.spec.ts'
              - 'library/mealie/**'
            e2e-paperless-ngx:
              - 'tests/e2e/paperless-ngx.spec.ts'
              - 'library/paperless-ngx/**'
            e2e-outline:
              - 'tests/e2e/outline.spec.ts'
              - 'library/outline/**'
            e2e-gitea:
              - 'tests/e2e/gitea.spec.ts'
              - 'library/gitea/**'
            e2e-bookstack:
              - 'tests/e2e/bookstack.spec.ts'
              - 'library/bookstack/**'

  lint:
    needs: [changes]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: shellcheck -x commands config install functions subcommands/*

  unit-tests:
    needs: [changes]
    if: needs.changes.outputs.unit-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  e2e-checkout:
    needs: [changes, lint, unit-tests]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.e2e-checkout == 'true')
    uses: ./.github/workflows/e2e-app.yml
    with:
      app-name: test-uptime-kuma
      manifest: uptime-kuma
      test-spec: tests/e2e/checkout.spec.ts
      dokku-plugins: postgres

  e2e-lifecycle:
    needs: [changes, lint, unit-tests]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.e2e-lifecycle == 'true')
    uses: ./.github/workflows/e2e-app.yml
    with:
      app-name: test-lifecycle-app
      manifest: uptime-kuma
      test-spec: tests/e2e/lifecycle.spec.ts
      dokku-plugins: postgres

  e2e-doctor:
    needs: [changes, lint, unit-tests]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.e2e-doctor == 'true')
    uses: ./.github/workflows/e2e-app.yml
    with:
      app-name: test-doctor-app
      manifest: uptime-kuma
      test-spec: tests/e2e/doctor.spec.ts
      dokku-plugins: postgres

  e2e-ghost:
    needs: [changes, lint, unit-tests]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.e2e-ghost == 'true')
    uses: ./.github/workflows/e2e-app.yml
    with:
      app-name: test-ghost
      manifest: ghost
      test-spec: tests/e2e/ghost.spec.ts
      dokku-plugins: mariadb
      extra-deploy-flags: "--no-mail"

  e2e-linkding:
    needs: [changes, lint, unit-tests]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.e2e-linkding == 'true')
    uses: ./.github/workflows/e2e-app.yml
    with:
