name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
    types: [opened, synchronize, reopened, labeled]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      lint: ${{ steps.filter.outputs.lint }}
      unit-tests: ${{ steps.filter.outputs.unit-tests }}
      e2e-checkout: ${{ steps.filter.outputs.e2e-checkout }}
      e2e-lifecycle: ${{ steps.filter.outputs.e2e-lifecycle }}
      e2e-doctor: ${{ steps.filter.outputs.e2e-doctor }}
      e2e-ghost: ${{ steps.filter.outputs.e2e-ghost }}
      e2e-linkding: ${{ steps.filter.outputs.e2e-linkding }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'commands'
              - 'config'
              - 'functions'
              - 'install'
              - 'plugin.toml'
              - 'subcommands/**'
              - 'tests/e2e/helpers.ts'
              - 'tests/e2e/global-setup.ts'
              - 'tests/e2e/global-teardown.ts'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            lint:
              - 'commands'
              - 'config'
              - 'functions'
              - 'install'
              - 'subcommands/**'
              - '.github/workflows/ci.yml'
            unit-tests:
              - 'library/**'
              - 'tests/unit/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            e2e-checkout:
              - 'tests/e2e/checkout.spec.ts'
              - 'library/uptime-kuma/**'
            e2e-lifecycle:
              - 'tests/e2e/lifecycle.spec.ts'
              - 'library/uptime-kuma/**'
            e2e-doctor:
              - 'tests/e2e/doctor.spec.ts'
              - 'subcommands/doctor*'
              - 'library/uptime-kuma/**'
            e2e-ghost:
              - 'tests/e2e/ghost.spec.ts'
              - 'library/ghost/**'
            e2e-linkding:
              - 'tests/e2e/linkding.spec.ts'
              - 'library/linkding/**'

  lint:
    needs: [changes]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: shellcheck -x commands config install functions subcommands/*

  unit-tests:
    needs: [changes]
    if: needs.changes.outputs.unit-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  e2e-checkout:
    needs: [changes, lint, unit-tests]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.e2e-checkout == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps
      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core
      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres
      - name: Install library plugin
        run: |
          sudo mkdir -p /var/lib/dokku/plugins/available/library/subcommands
          sudo mkdir -p /var/lib/dokku/plugins/available/library/library
          sudo cp commands config functions install plugin.toml /var/lib/dokku/plugins/available/library/
          sudo cp subcommands/* /var/lib/dokku/plugins/available/library/subcommands/
          sudo cp -r library/* /var/lib/dokku/plugins/available/library/library/
          sudo chmod +x /var/lib/dokku/plugins/available/library/commands
          sudo chmod +x /var/lib/dokku/plugins/available/library/subcommands/*
          sudo dokku plugin:enable library || true
          sudo bash /var/lib/dokku/plugins/enabled/library/install
          sudo dokku library:list
      - name: Deploy test app via bash
        run: |
          echo "127.0.0.1 test-uptime-kuma.test.local" | sudo tee -a /etc/hosts
          sudo dokku library:checkout uptime-kuma \
            --name=test-uptime-kuma \
            --domain=test-uptime-kuma.test.local \
            --no-ssl --no-auth --non-interactive
      - name: Verify deployment state
        run: |
          echo "=== Dokku version ==="
          dokku version || true
          echo "=== App exists? ==="
          sudo dokku apps:exists test-uptime-kuma && echo "YES" || echo "NO"
          echo "=== ps:report ==="
          sudo dokku ps:report test-uptime-kuma 2>&1 || true
          echo "=== Docker containers ==="
          sudo docker ps -a 2>&1 || true
          echo "=== Library state directory ==="
          ls -laR /var/lib/dokku/services/library/apps/test-uptime-kuma/ 2>&1 || echo "STATE DIR MISSING"
          echo "=== Ports config ==="
          sudo dokku ports:report test-uptime-kuma 2>&1 || true
          echo "=== Proxy config ==="
          sudo dokku proxy:report test-uptime-kuma 2>&1 || true
          echo "=== Nginx config ==="
          sudo cat /home/dokku/test-uptime-kuma/nginx.conf 2>&1 || echo "No nginx.conf"
          echo "=== DEPLOYED flag ==="
          ls -la /home/dokku/test-uptime-kuma/DEPLOYED 2>&1 || echo "DEPLOYED file missing"
      - name: Run checkout e2e tests
        run: npx playwright test tests/e2e/checkout.spec.ts --project=integration
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-checkout-results
          path: playwright-report/
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Plugin paths ==="
          ls -la /var/lib/dokku/plugins/available/library/ || true
          ls -la /var/lib/dokku/plugins/enabled/library/ || true
          echo "=== Try running library:list ==="
          sudo dokku library:list 2>&1 || true
          echo "=== Try running library:list --installed ==="
          sudo dokku library:list --installed 2>&1 || true
          echo "=== Dokku apps ==="
          sudo dokku apps:list 2>/dev/null || true
          echo "=== ps:report ==="
          sudo dokku ps:report 2>/dev/null || true
          echo "=== Docker containers ==="
          sudo docker ps -a 2>/dev/null || true
          echo "=== Docker logs ==="
          for container in $(sudo docker ps -aq 2>/dev/null); do
            echo "--- Container $container ---"
            sudo docker logs --tail 50 "$container" 2>/dev/null || true
          done
          echo "=== Library state ==="
          ls -laR /var/lib/dokku/services/library/apps/ 2>&1 || echo "No state dir"
          echo "=== DEPLOYED flag ==="
          ls -la /home/dokku/test-uptime-kuma/DEPLOYED 2>&1 || echo "DEPLOYED file missing"

  e2e-lifecycle:
