name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
    types: [opened, synchronize, reopened, labeled]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: shellcheck -x commands config install functions subcommands/*

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # --- E2E jobs: enabling one-by-one ---
  # Known issues remaining:
  #   - dokku-auth repo doesn't exist yet (all e2e-app jobs)

  e2e-checkout:
    needs: [lint, unit-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps
      - name: Install Dokku
        run: |
          wget -NP . https://packagecloud.io/dokku/dokku/gpgkey
          sudo apt-key add gpgkey
          echo "deb https://packagecloud.io/dokku/dokku/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dokku
          sudo dokku plugin:install-dependencies --core
      - name: Install dokku-postgres
        run: sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres
      - name: Install library plugin
        run: |
          # Copy only plugin files (not node_modules, .git, tests, etc.)
          sudo mkdir -p /var/lib/dokku/plugins/available/library
          for f in commands config install functions plugin.toml; do
            sudo cp "${{ github.workspace }}/$f" /var/lib/dokku/plugins/available/library/
          done
          sudo cp -r "${{ github.workspace }}/subcommands" /var/lib/dokku/plugins/available/library/
          sudo cp -r "${{ github.workspace }}/library" /var/lib/dokku/plugins/available/library/
          # plugin:enable exits 10 during bash-completion priming (DOKKU_NOT_IMPLEMENTED_EXIT) — expected
          sudo dokku plugin:enable library || true
          # Run the plugin install hook to create data directories
          sudo bash /var/lib/dokku/plugins/enabled/library/install
          # Verify the plugin is registered
          sudo dokku library:list
      - name: Debug checkout (mimic test sequence)
        run: |
          echo "=== Step 1: cleanup (like test does) ==="
          sudo dokku library:cleanup test-uptime-kuma --force 2>&1 || true
          sudo dokku apps:destroy test-uptime-kuma --force 2>&1 || true

          echo "=== Step 2: checkout (exact test command) ==="
          set +e
          sudo dokku library:checkout uptime-kuma --name=test-uptime-kuma --domain=test-uptime-kuma.test.local --no-ssl --no-auth --non-interactive > /tmp/co-stdout.txt 2>/tmp/co-stderr.txt
          EXIT_CODE=$?
          set -e
          echo "EXIT_CODE=$EXIT_CODE"
          echo "=== STDOUT ==="
          cat /tmp/co-stdout.txt
          echo "=== STDERR ==="
          cat /tmp/co-stderr.txt

          echo "=== Step 3: verify ==="
          sudo dokku apps:list 2>&1 || true
          sudo dokku ps:report test-uptime-kuma 2>&1 || true
          ls -la /var/lib/dokku/services/library/apps/test-uptime-kuma/ 2>&1 || true

          echo "=== Step 4: also run via node execSync to match test env ==="
          node -e "
            const { execSync } = require('child_process');
            try {
              const result = execSync('sudo dokku library:checkout uptime-kuma --name=test-kuma2 --domain=test-kuma2.test.local --no-ssl --no-auth --non-interactive', {
                timeout: 300000,
                encoding: 'utf-8',
                stdio: ['pipe', 'pipe', 'pipe'],
              });
              console.log('SUCCESS:', result);
            } catch (err) {
              console.log('FAILED exit code:', err.status);
              console.log('STDOUT:', err.stdout);
              console.log('STDERR:', err.stderr);
            }
          "

          echo "=== Cleanup ==="
          sudo dokku apps:destroy test-uptime-kuma --force 2>/dev/null || true
          sudo dokku apps:destroy test-kuma2 --force 2>/dev/null || true
          sudo rm -rf /var/lib/dokku/services/library/apps/test-uptime-kuma 2>/dev/null || true
          sudo rm -rf /var/lib/dokku/services/library/apps/test-kuma2 2>/dev/null || true
      - name: Run checkout e2e tests
        run: npx playwright test tests/e2e/checkout.spec.ts --project=integration
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-checkout-results
          path: playwright-report/
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Plugin paths ==="
          ls -la /var/lib/dokku/plugins/available/library/ || true
          ls -la /var/lib/dokku/plugins/enabled/library/ || true
          echo "=== Try running library:list ==="
          sudo dokku library:list 2>&1 || true
          echo "=== Dokku apps ==="
          sudo dokku apps:list 2>/dev/null || true
          sudo dokku ps:report 2>/dev/null || true
          sudo docker ps -a 2>/dev/null || true

