library:
  description: Minimalist RSS reader
  url: https://miniflux.app
  prompts:
    - key: DOMAIN
      question: Domain for Miniflux
      default: miniflux.%HOSTNAME%

services:
  db:
    type: postgres

apps:
  miniflux:
    image: miniflux/miniflux:latest
    domains: ["%DOMAIN%"]
    links:
      postgres: db
    env:
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "%SECRET%"
      BASE_URL: "http://%DOMAIN%"
    ports:
      http: "80:8080"
    letsencrypt: true
    healthchecks:
      web:
        - path: /healthcheck
          timeout: 60
