server:
  http_listen_port: 0
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: "%LOKI_URL%"

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_dokku_app_name"]
        target_label: app
      - source_labels: ["__meta_docker_container_label_com_dokku_app_name"]
        regex: ".+"
        action: keep
