library:
  description: Open-source monitoring and observability platform
  url: https://grafana.com
  prompts:
    - key: DOMAIN
      question: Domain for Grafana
      default: grafana.%HOSTNAME%
  connection_env:
    service: db
    type: postgres
    mode: map
    map:
      host_port: GF_DATABASE_HOST
      user: GF_DATABASE_USER
      password: GF_DATABASE_PASSWORD
      name: GF_DATABASE_NAME

services:
  db:
    type: postgres

apps:
  grafana:
    image: grafana/grafana:latest
    domains: ["%DOMAIN%"]
    links:
      postgres: db
    env:
      GF_SERVER_ROOT_URL: "http://%DOMAIN%"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_PASSWORD: "%SECRET%"
    ports:
      http: "80:3000"
    letsencrypt: true
    healthchecks:
      web:
        - path: /api/health
          timeout: 60
